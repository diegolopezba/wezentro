    <!-- Critical CSS: paint the app shell before JS/CSS bundles arrive -->
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        background: #0A0A0B;
        color: #FAFAFA;
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
      #root { min-height: 100dvh; background: #0A0A0B; }
      /* Splash shown until React mounts and removes #app-splash */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0A0A0B;
        z-index: 9999;
        transition: opacity 260ms ease;
      }
      #app-splash.is-hiding { opacity: 0; pointer-events: none; }
      #app-splash img {
        width: 192px;
        height: 192px;
        object-fit: contain;
        opacity: 0;
        animation: splash-in 300ms ease 40ms forwards;
      }
      @keyframes splash-in {
        from { opacity: 0; transform: scale(0.92); }
        to   { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash, #app-splash img { transition: none; animation: none; opacity: 1; }
      }
    </style>
